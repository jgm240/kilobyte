# Kinlobyte: the Kindle starts Kilobyte instead of its home screen.
# Installed by Update_kinlobyte_boot_install.bin (Kinlobyte, GNU GPL 3+).
#
# Off: put a file named DONT_START_KINLOBYTE in the Kindle's main folder
# (over USB, next to "documents"). Removed by Update_kinlobyte_boot_uninstall.bin.
#
# Once per boot only: leaving Kinlobyte starts the reading interface again,
# which sends framework_ready again, and that must not open Kinlobyte anew.

start on framework_ready
task

script
    [ -e /mnt/us/DONT_START_KINLOBYTE ] && exit 0
    [ -e /tmp/kinlobyte-booted ] && exit 0
    [ -f /mnt/us/documents/Kinlobyte.sh ] && [ -f /mnt/us/kinlobyte/kinlobyte.img ] || exit 0
    : > /tmp/kinlobyte-booted
    # Let the home screen come up first, so the reading interface is in a
    # state where it can be stopped cleanly.
    lipc-wait-event -s 60 com.lab126.appmgrd appStarted || true
    sleep 3
    KINLOBYTE_BOOT=1 /bin/sh /mnt/us/documents/Kinlobyte.sh
end script
