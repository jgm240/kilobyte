# KilobytEink: the Kindle starts Kilobyte instead of its home screen.
# Installed by Update_kilobyteink_boot_install.bin (KilobytEink, GNU GPL 3+).
#
# Off: put a file named DONT_START_KILOBYTEINK in the Kindle's main folder
# (over USB, next to "documents"). Removed by Update_kilobyteink_boot_uninstall.bin.
#
# Once per boot only: leaving KilobytEink starts the reading interface again,
# which sends framework_ready again, and that must not open KilobytEink anew.

start on framework_ready
task

script
    [ -e /mnt/us/DONT_START_KILOBYTEINK ] && exit 0
    [ -e /mnt/us/DONT_START_KINLOBYTE ] && exit 0      # (its name before KilobytEink)
    [ -e /tmp/kilobyteink-booted ] && exit 0
    [ -f /mnt/us/documents/KilobytEink.sh ] || exit 0
    # (KilobytEink.sh moves a folder from before the name change, kinlobyte, itself.)
    [ -f /mnt/us/kilobyteink/kilobyteink.img ] || [ -f /mnt/us/kinlobyte/kinlobyte.img ] || exit 0
    : > /tmp/kilobyteink-booted
    # Let the home screen come up first, so the reading interface is in a
    # state where it can be stopped cleanly.
    lipc-wait-event -s 60 com.lab126.appmgrd appStarted || true
    sleep 3
    KILOBYTEINK_BOOT=1 /bin/sh /mnt/us/documents/KilobytEink.sh
end script
