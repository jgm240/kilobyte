# KilobytEink settings (read by documents/KilobytEink.sh when it starts).

# Font size of the terminal; empty: kterm's own (8). Smaller fits more:
# Kilobyte's dialogs are up to 76 characters wide.
FONT_SIZE=

# Screen orientation: U (upright), R or L (turned right or left, landscape:
# more characters per line).
ORIENTATION=U

# kterm's on-screen keyboard: 1 on, 0 off.
KEYBOARD=1

# 1: stop the Kindle's reading interface while KilobytEink runs (about 100 MB
# more for KilobytEink; the Kindle's home screen comes back about half a minute
# after you leave). 0: leave it running.
STOP_UI=1

# kterm's folder (the one with bin/kterm). Empty: KilobytEink looks in
# /mnt/us/kmc/kpm/packages/kterm, /mnt/us/kterm and /mnt/us/extensions/kterm,
# then searches the storage.
KTERM=
