
# --- The Mac version ---
# Old Mac firmware gives Linux no screen of its own: Linux keeps drawing on
# the one GRUB set up (without this, the GRUB picture stays while Kilobyte
# runs unseen).
set gfxpayload=keep
# For Macs whose graphics driver does not take over the screen: NVIDIA's and
# ATI's drivers off (the screen GRUB set up stays), or every graphics driver
# off.
menuentry "Kilobyte (Mac: graphics driver off)" {
    linux /live/vmlinuz boot=live consoleblank=0 nouveau.modeset=0 radeon.modeset=0
    initrd /live/initrd.img
}
menuentry "Kilobyte (Mac: firmware screen only)" {
    linux /live/vmlinuz boot=live consoleblank=0 nomodeset
    initrd /live/initrd.img
}
menuentry "Install Kilobyte (Mac: graphics driver off)" {
    linux /live/vmlinuz boot=live consoleblank=0 kilobyte.install nouveau.modeset=0 radeon.modeset=0
    initrd /live/initrd.img
}
