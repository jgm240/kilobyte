# Kilobyte live medium boot menu
set timeout=5
set default=0
set menu_color_normal=white/blue
set menu_color_highlight=blue/light-gray
set color_normal=white/blue

# The Kilobyte menu in graphics mode (text mode if the screen can't).
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
set gfxmode=1024x768,800x600,auto
if loadfont $prefix/fonts/unicode.pf2; then
    if terminal_output gfxterm; then
        set theme=$prefix/themes/kilobyte/theme.txt
    fi
fi

# No "quiet": every start-up message shows, under the Kilobyte logo.
menuentry "Kilobyte (live)" {
    linux /live/vmlinuz boot=live consoleblank=0
    initrd /live/initrd.img
}
menuentry "Install Kilobyte" {
    linux /live/vmlinuz boot=live consoleblank=0 kilobyte.install
    initrd /live/initrd.img
}
menuentry "Kilobyte (live, copied to RAM - the stick can be removed)" {
    linux /live/vmlinuz boot=live toram consoleblank=0
    initrd /live/initrd.img
}
menuentry "Kilobyte (safe graphics)" {
    linux /live/vmlinuz boot=live nomodeset consoleblank=0
    initrd /live/initrd.img
}
menuentry "Kilobyte (quiet start)" {
    linux /live/vmlinuz boot=live quiet loglevel=3 consoleblank=0
    initrd /live/initrd.img
}
