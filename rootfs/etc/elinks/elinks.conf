## Kilobyte: ELinks with JavaScript and CSS, in the console's 16 colours.
set ecmascript.enable = 1
set document.css.enable = 1
set document.colors.use_document_colors = 2
set document.browse.links.numbering = 0
set document.browse.images.show_as_links = 1
set terminal.linux.colors = 1
set terminal.linux.utf_8_io = 1
set terminal.xterm-256color.colors = 3
set terminal.xterm-256color.utf_8_io = 1
set ui.startup_goto_dialog = 0
set ui.success_msgbox = 0
set ui.sessions.homepage = "file:///usr/share/kilobyte/start.html"
set cookies.accept_policy = 2
set connection.ssl.cert_verify = 1
