# Kilobyte's file kinds for the file manager (mc): Enter opens a file with
# Kilobyte's program for it, F3 shows pictures in blocks. The rest of this
# file is mc's own list (archives, packages, ...), added when it is set up.
[mc.ext.ini]
Version=4.0

[kilobyte-picture]
Regex=\.(png|jpe?g|gif|bmp|webp|tiff?)$
RegexIgnoreCase=true
Open=/usr/lib/kilobyte/kb-open %f
View=/usr/lib/kilobyte/kb-view %f

[kilobyte-sound]
Regex=\.(mp3|ogg|oga|flac|wav|m4a|opus|aac|wma|m3u8?)$
RegexIgnoreCase=true
Open=/usr/lib/kilobyte/kb-open %f

[kilobyte-video]
Regex=\.(mp4|mkv|avi|mov|webm|mpe?g|flv|wmv|m4v)$
RegexIgnoreCase=true
Open=/usr/lib/kilobyte/kb-open %f

[kilobyte-office]
Regex=\.(docx|odt|xlsx|ods|csv|tsv|sc)$
RegexIgnoreCase=true
Open=/usr/lib/kilobyte/kb-open %f

[kilobyte-pdf]
Regex=\.pdf$
RegexIgnoreCase=true
Open=/usr/lib/kilobyte/kb-open %f
View=%view{ascii} pdftotext -layout %f -

[kilobyte-web]
Regex=\.html?$
RegexIgnoreCase=true
Open=/usr/lib/kilobyte/kb-open %f

[kilobyte-windows]
Regex=\.(exe|msi|ica)$
RegexIgnoreCase=true
Open=/usr/lib/kilobyte/kb-open %f

